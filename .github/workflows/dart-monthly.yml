name: DART monthly update

on:
  schedule:
    - cron: '15 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sk-hynix-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check DART API key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "DART_API_KEY GitHub Actions secret is required." >&2
            exit 1
          fi

      - name: Crawl OpenDART reports
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/collect.py

      - name: Calculate financial indicators
        run: python src/analyze.py

      - name: Build dashboard
        run: python src/dashboard.py

      - name: Save refreshed data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.csv data/financial_statements.csv data/metrics.csv docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SK hynix DART dashboard data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
